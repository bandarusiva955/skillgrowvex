<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" role="img" aria-label="AI neural network learning visual">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0A2540"/><stop offset="1" stop-color="#123e65"/></linearGradient>
<radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#D4A017" stop-opacity="0.35"/><stop offset="1" stop-color="#D4A017" stop-opacity="0"/></radialGradient>
</defs>
<style>
.flow{stroke:#D4A017;stroke-opacity:.5;stroke-width:1.3;fill:none;stroke-dasharray:5 7;animation:dash 1.6s linear infinite}
@keyframes dash{to{stroke-dashoffset:-24}}
.node{fill:#0A2540;stroke:#D4A017;stroke-width:2.5;transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-in-out infinite}
.d1{animation-delay:.3s}.d2{animation-delay:.6s}.d3{animation-delay:.9s}.d4{animation-delay:1.2s}.d5{animation-delay:1.5s}
@keyframes pulse{0%,100%{transform:scale(1);fill:#0A2540}50%{transform:scale(1.3);fill:#D4A017}}
.spark{fill:#ffffff;animation:twinkle 3s ease-in-out infinite}
.s2{animation-delay:1s}.s3{animation-delay:2s}
@keyframes twinkle{0%,100%{opacity:.1}50%{opacity:.9}}
.lbl{fill:#9eeeed;font-family:Segoe UI,Arial,sans-serif;font-size:11px;font-weight:700;letter-spacing:2px;text-anchor:middle}
</style>
<rect width="600" height="440" rx="28" fill="url(#bg)"/>
<circle cx="300" cy="245" r="210" fill="url(#glow)"/>
<text x="40" y="52" fill="#D4A017" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="3">AI-POWERED LEARNING</text>
<text x="40" y="82" fill="#ffffff" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="700">Learn. Build. Grow.</text>
<polygon points="530,36 568,54 530,72 492,54" fill="#D4A017"/>
<path d="M508 64v16q22 12 44 0v-16l-22 10z" fill="#D4A017" fill-opacity=".75"/>
<line x1="568" y1="54" x2="568" y2="82" stroke="#D4A017" stroke-width="2"/>
<g transform="translate(0,12)">
<path class="flow" d="M110 140L300 105M110 140L300 175M110 140L300 245M110 140L300 315M110 140L300 385"/>
<path class="flow" d="M110 210L300 105M110 210L300 175M110 210L300 245M110 210L300 315M110 210L300 385"/>
<path class="flow" d="M110 280L300 105M110 280L300 175M110 280L300 245M110 280L300 315M110 280L300 385"/>
<path class="flow" d="M110 350L300 105M110 350L300 175M110 350L300 245M110 350L300 315M110 350L300 385"/>
<path class="flow" d="M300 105L490 175M300 105L490 245M300 105L490 315"/>
<path class="flow" d="M300 175L490 175M300 175L490 245M300 175L490 315"/>
<path class="flow" d="M300 245L490 175M300 245L490 245M300 245L490 315"/>
<path class="flow" d="M300 315L490 175M300 315L490 245M300 315L490 315"/>
<path class="flow" d="M300 385L490 175M300 385L490 245M300 385L490 315"/>
<circle class="node d1" cx="110" cy="140" r="11"/>
<circle class="node d2" cx="110" cy="210" r="11"/>
<circle class="node d3" cx="110" cy="280" r="11"/>
<circle class="node d4" cx="110" cy="350" r="11"/>
<circle class="node d1" cx="300" cy="105" r="13"/>
<circle class="node d2" cx="300" cy="175" r="13"/>
<circle class="node d3" cx="300" cy="245" r="13"/>
<circle class="node d4" cx="300" cy="315" r="13"/>
<circle class="node d5" cx="300" cy="385" r="13"/>
<circle class="node d3" cx="490" cy="175" r="11"/>
<circle class="node d4" cx="490" cy="245" r="11"/>
<circle class="node d5" cx="490" cy="315" r="11"/>
</g>
<text class="lbl" x="110" y="426">LEARN</text>
<text class="lbl" x="300" y="426">BUILD</text>
<text class="lbl" x="490" y="426">CAREER</text>
<circle class="spark" cx="60" cy="140" r="2"/>
<circle class="spark s2" cx="200" cy="120" r="2"/>
<circle class="spark s3" cx="410" cy="110" r="2"/>
<circle class="spark s2" cx="555" cy="190" r="2"/>
<circle class="spark" cx="45" cy="330" r="2"/>
<circle class="spark s3" cx="560" cy="360" r="2"/>
</svg>